name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: quickstart-1557122992346
  REGION: europe-north1
  SERVICE_NAME: treningsprogram
  # Artifact Registry repo — create once with:
  #   gcloud artifacts repositories create treningsprogram \
  #     --repository-format=docker --location=europe-north1 \
  #     --project=quickstart-1557122992346
  IMAGE: europe-north1-docker.pkg.dev/quickstart-1557122992346/treningsprogram/app
  WIF_PROVIDER: projects/592821691209/locations/global/workloadIdentityPools/github/providers/github-provider
  WIF_SERVICE_ACCOUNT: okr-tracker-deploy@quickstart-1557122992346.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -t "${{ env.IMAGE }}:latest" .
          docker push "$IMAGE_TAG"
          docker push "${{ env.IMAGE }}:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 2 \
            --memory 128Mi \
            --cpu 1

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)'
